<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anime OP/ED Ranker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app">
      <p id="warning" class="warning hidden">
        Progress can’t be saved — storage is unavailable or full. Your ranking will still work during this session.
      </p>
      <section id="start-screen" class="screen">
        <h1>Anime OP/ED Ranker</h1>
        <p id="status">Loading…</p>
        <label class="shuffle-toggle">
          <input id="shuffle" type="checkbox" />
          <span>Shuffle starting order</span>
        </label>
        <label class="load-csv">
          <span>Load your own CSV</span>
          <input id="file-input" type="file" accept=".csv,text/csv" />
        </label>
        <div class="actions">
          <button id="start-btn" class="primary">Start</button>
          <button id="resume-btn" class="primary hidden">Resume</button>
          <button id="reset-btn">Reset</button>
        </div>
      </section>

      <section id="match-screen" class="screen hidden">
        <header class="progress">
          <div class="bar"><div id="progress-bar"></div></div>
          <span id="progress-label"></span>
        </header>
        <div id="panels">
          <div id="panel-a" class="panel" role="button" tabindex="0"></div>
          <div id="panel-b" class="panel" role="button" tabindex="0"></div>
        </div>
        <footer class="match-footer">
          <button id="undo-btn">Undo</button>
          <button id="preview-btn">Preview ranking</button>
          <button id="pause-btn">Pause &amp; exit</button>
          <label class="volume">
            <span>Volume</span>
            <input id="volume" type="range" min="0" max="1" step="0.01" value="1" />
          </label>
          <span class="hint">Click a panel or press ← / → to pick · hover to hear · U to unmute</span>
        </footer>
      </section>

      <section id="results-screen" class="screen hidden">
        <h1>Your ranking</h1>
        <ol id="results-list"></ol>
        <div class="actions">
          <button id="copy-btn">Copy</button>
          <button id="download-btn">Download CSV</button>
          <button id="again-btn">Play again</button>
        </div>
      </section>
    </main>
    <div id="preview-modal" class="modal hidden">
      <div class="modal-card">
        <div class="modal-head">
          <h2>Current ranking</h2>
          <button id="preview-close" type="button">Close</button>
        </div>
        <p class="modal-note">Provisional — updates as you keep picking.</p>
        <ol id="preview-list"></ol>
      </div>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
